name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Prepare signing keystore
        env:
          SIGNING_STORE_PASSWORD: mpv-android-tokyonight
          SIGNING_KEY_ALIAS: mpv-android-tokyonight
        run: |
          key_path=".github/keys/mpv-android.jks"
          generated=false
          if [[ ! -f "$key_path" ]]; then
            mkdir -p "$(dirname "$key_path")"
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$key_path" \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -keypass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" \
              -dname "CN=mpv-android-tokyonight" \
              -keyalg RSA -keysize 2048 -validity 10000
            generated=true
          fi
          {
            printf 'MPV_SIGNING_KEYSTORE=%s/%s\n' "$GITHUB_WORKSPACE" "$key_path"
            printf 'MPV_SIGNING_STORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'MPV_SIGNING_KEY_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'MPV_SIGNING_KEY_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'SIGNING_KEY_GENERATED=%s\n' "$generated"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build
        env:
          DONT_BUILD_DEBUG: "1"

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-v8a-release
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk
          archive: false

      - uses: actions/upload-artifact@v7
        if: ${{ env.SIGNING_KEY_GENERATED == 'true' }}
        with:
          name: mpv-android-signing-keystore
          path: .github/keys/mpv-android.jks
          archive: false
